version: "3.8"
services:
  web:
    # MUST be all lowercase
    image: ghcr.io/tristangrlt/pvc-algograph-project-2025-l3:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    restart: always

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup
    restart: always
